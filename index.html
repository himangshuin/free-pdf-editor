<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Editor – Assamese (অসমীয়া) support</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&family=Noto+Serif+Bengali:wght@400;700&family=Hind+Siliguri:wght@400;600&family=Anek+Bangla:wght@400;700&family=Roboto:wght@400;700&display=swap">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1b2130;--muted:#6b7385;--line:#e1e4ea;--accent:#4f46e5;--accent-t:#fff;--stage:#e9ebf0;--sh:0 2px 14px rgba(20,24,40,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1d222b;--text:#e8ebf1;--muted:#97a0b2;--line:#323946;--accent:#8b87ff;--accent-t:#10121f;--stage:#0f1216;--sh:0 2px 14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1d222b;--text:#e8ebf1;--muted:#97a0b2;--line:#323946;--accent:#8b87ff;--accent-t:#10121f;--stage:#0f1216;--sh:0 2px 14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.4 "Noto Sans Bengali",Roboto,system-ui,sans-serif;overflow:hidden}
button,select,input{font:inherit;font-size:13px;color:var(--text)}
button,select,input[type=number],input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=color]{width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
input[type=number]{width:64px}input[type=search]{width:150px}
label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-size:16px}.brand span{color:var(--muted)}
#fn{color:var(--muted);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
#props{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-height:46px;flex-wrap:wrap}
#hint{color:var(--muted);margin-right:auto}
[hidden]{display:none!important}
main{flex:1;display:flex;min-height:0}
#rail{width:66px;flex:none;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
#rail button{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:none;padding:6px 2px;border-radius:10px;font-size:10px;color:var(--muted)}
#rail button b{font-size:18px;font-weight:600;color:var(--text);line-height:1.15}
#rail button:hover{background:var(--bg)}
#rail button.on{background:var(--accent);color:var(--accent-t)}#rail button.on b{color:var(--accent-t)}
#rail hr{border:0;border-top:1px solid var(--line);width:80%;margin:4px auto}
#side{width:140px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:10px;overflow-y:auto}
.th{border:2px solid transparent;border-radius:8px;padding:4px;margin-bottom:10px;cursor:pointer;position:relative}
.th:hover{background:var(--bg)}.th.cur{border-color:var(--accent)}
.th canvas{width:100%;display:block;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.th small{display:flex;justify-content:space-between;align-items:center;margin-top:4px;color:var(--muted)}
.th .acts{display:none;gap:2px}.th:hover .acts,.th.cur .acts{display:flex}
.th .acts button{padding:0 6px;font-size:12px;border-radius:6px}
#sb{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#stage{flex:1;overflow:auto;padding:24px;background:var(--stage);text-align:center}
#wrap{position:relative;display:inline-block;box-shadow:var(--sh);background:#fff;text-align:left;margin-bottom:70px}
canvas{display:block}
#ed{position:absolute;border:2px solid var(--accent);background:rgba(255,255,255,.96);color:#000;padding:0 2px;outline:none;line-height:1.3;border-radius:3px}
#empty{max-width:440px;margin:8vh auto 0;background:var(--panel);border:2px dashed var(--line);border-radius:18px;padding:36px 24px}
#empty .ic{font-size:44px}#empty h2{margin:6px 0;font-size:20px}#empty p{color:var(--muted);margin:4px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.chips span{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 10px;box-shadow:var(--sh);white-space:nowrap}
#dock button{border-radius:99px;padding:4px 10px}#dock input{width:48px;text-align:center;padding:4px}
#dock i{width:1px;height:20px;background:var(--line);margin:0 4px}
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#drop{position:fixed;inset:10px;border:3px dashed var(--accent);border-radius:18px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:flex;align-items:center;justify-content:center;font-size:22px;z-index:30;pointer-events:none}
@media (max-width:760px){main{flex-direction:column}#rail{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}#rail button{min-width:52px}#rail hr{display:none}
#side{width:auto;display:flex;gap:8px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding:6px}.th{min-width:84px;margin:0}#stage{padding:12px}#fn,.brand span{display:none}}
</style>
</head>
<body>
<header id="top">
  <div class="brand">📝 <b>PDF Editor</b> <span>· অসমীয়া</span></div><span id="fn"></span><div class="sp"></div>
  <input type="search" id="q" placeholder="Search text…" aria-label="Search text">
  <button id="open">Open</button><button id="merge" disabled>+ Add PDF</button>
  <button id="undo" disabled title="Ctrl+Z">↶ Undo</button>
  <button class="primary" id="save" disabled>⬇ Download</button>
  <input type="file" id="file" accept="application/pdf" hidden><input type="file" id="file2" accept="application/pdf" hidden><input type="file" id="imgf" accept="image/*" hidden>
</header>
<div id="props">
  <span id="hint"></span>
  <label data-p="font">Font <select id="font"><option>Noto Sans Bengali</option><option>Noto Serif Bengali</option><option>Hind Siliguri</option><option>Anek Bangla</option><option>Roboto</option></select></label>
  <label data-p="size">Size <input type="number" id="size" placeholder="auto" min="6" max="200"></label>
  <label data-p="tc">Color <input type="color" id="tc" value="#000000"></label>
  <label data-p="lw">Width <input type="number" id="lw" value="2" min="1" max="30" style="width:54px"></label>
  <label data-p="ec">Erase color <input type="color" id="ec" value="#ffffff"></label>
  <label data-p="hc">Highlight <input type="color" id="hc" value="#ffe600"></label>
  <button data-p="del" id="del">🗑 Delete</button>
</div>
<main>
  <nav id="rail" aria-label="Tools">
    <button data-mode="select" title="Select / move (V)"><b>↖</b>Select</button>
    <hr>
    <button data-mode="edit" title="Edit existing text (E)"><b>✎</b>Edit</button>
    <button data-mode="add" title="Add text (T)"><b>T</b>Text</button>
    <button data-mode="erase" title="Erase (X)"><b>⌫</b>Erase</button>
    <hr>
    <button data-mode="hl" title="Highlight (H)"><b>▰</b>Mark</button>
    <button data-mode="ul" title="Underline (U)"><b style="text-decoration:underline">U</b>Under</button>
    <button data-mode="st" title="Strikethrough (S)"><b style="text-decoration:line-through">S</b>Strike</button>
    <hr>
    <button data-mode="pen" title="Pen (P)"><b>✏</b>Pen</button>
    <button data-mode="rect" title="Box (R)"><b>▭</b>Box</button>
    <button data-mode="ell" title="Oval (O)"><b>◯</b>Oval</button>
    <button data-mode="line" title="Line (L)"><b>／</b>Line</button>
    <button id="img" title="Insert image or signature (I)"><b>🖼</b>Image</button>
  </nav>
  <aside id="side" hidden></aside>
  <section id="sb">
    <div id="stage">
      <div id="empty"><div class="ic">📄</div><h2>Open a PDF to start editing</h2><p>Drag and drop a file here, or choose one from your device. Nothing is uploaded; everything stays in your browser.</p>
        <button class="primary" id="open2">Choose PDF</button>
        <div class="chips"><span>Edit &amp; erase text</span><span>অসমীয়া fonts</span><span>Highlight</span><span>Draw &amp; shapes</span><span>Signature</span><span>Merge &amp; reorder</span></div></div>
      <div id="wrap" hidden><canvas id="cv"></canvas><input id="ed" hidden aria-label="Text"></div>
    </div>
    <div id="dock" hidden>
      <button id="prev" title="Previous page (PgUp)">‹</button><input type="number" id="pn" min="1" aria-label="Page"><span id="pt">/ 1</span><button id="next" title="Next page (PgDn)">›</button>
      <i></i><button id="zo" title="Zoom out">−</button><span id="zl">100%</span><button id="zi" title="Zoom in">+</button><button id="fit">Fit</button>
    </div>
  </section>
</main>
<div id="toast" role="status"></div><div id="drop" hidden>Drop a PDF to open it</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const S=2,$=id=>document.getElementById(id),Q=s=>document.querySelectorAll(s),cv=$("cv"),ctx=cv.getContext("2d"),ed=$("ed"),wrap=$("wrap");
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pages=[],cur=0,mode="select",undoS=[],drag=null,sel=null,mv=null,pending=null,hv=null,term="",fname="edited.pdf",zm=1,tt;
const HINT={select:"Click an object to move it · double-click text to edit · Delete removes it",edit:"Click any text in the PDF to replace it",add:"Click where the new text should go",erase:"Drag a box over anything to remove it",hl:"Click a line of text, or drag an area, to highlight",ul:"Click text to underline it",st:"Click text to strike it through",pen:"Draw freehand",rect:"Drag to draw a box",ell:"Drag to draw an oval",line:"Drag to draw a line"};
const NEED={select:"",edit:"font size tc ec",add:"font size tc",erase:"ec",hl:"hc",ul:"tc",st:"tc",pen:"tc lw",rect:"tc lw",ell:"tc lw",line:"tc lw"};
const SELN={t:"font size tc",s:"tc lw",l:"tc lw",p:"tc lw",h:"hc",r:"ec",i:""};

function toast(m,ms=2600){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);if(ms)tt=setTimeout(()=>t.classList.remove("show"),ms)}
const untoast=()=>$("toast").classList.remove("show");
const snap=()=>{undoS.push(pages.map(p=>({p,ops:p.ops.slice()})));if(undoS.length>60)undoS.shift();$("undo").disabled=false};
function undo(){const s=undoS.pop();if(!s)return;pages=s.map(x=>(x.p.ops=x.ops,x.p));cur=Math.min(cur,pages.length-1);sel=null;$("undo").disabled=!undoS.length;show()}
window.onbeforeunload=e=>{if(undoS.length){e.preventDefault();e.returnValue=""}};

async function loadPdf(buf){
  const doc=await pdfjsLib.getDocument({data:buf}).promise,out=[];
  for(let i=1;i<=doc.numPages;i++){
    toast("Loading page "+i+" of "+doc.numPages+"…",0);
    const p=await doc.getPage(i),vp=p.getViewport({scale:S}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    const tc=await p.getTextContent(),boxes=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const t=pdfjsLib.Util.transform(vp.transform,it.transform);
      boxes.push({x:t[4],y:t[5],w:it.width*S,fs:Math.hypot(t[2],t[3]),str:it.str})}
    out.push({base:c,boxes,ops:[]});
  }return out;
}
async function openFile(f,append){
  if(!f)return;
  if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){toast("Please choose a PDF file");return}
  if(!append&&undoS.length&&!confirm("Discard your unsaved edits and open a new PDF?"))return;
  try{const n=await loadPdf(await f.arrayBuffer());
    if(append){snap();pages.push(...n);toast("Added "+n.length+" page"+(n.length>1?"s":""))}
    else{pages=n;undoS=[];cur=0;sel=null;fname=f.name.replace(/\.pdf$/i,"")+"-edited.pdf";$("fn").textContent=f.name;
      $("empty").hidden=true;[wrap,$("side"),$("dock")].forEach(x=>x.hidden=false);["save","merge"].forEach(i=>$(i).disabled=false);$("undo").disabled=true;fit();untoast()}
    show()}catch(err){toast("Could not open that PDF: "+err.message,5000)}
}
$("open").onclick=$("open2").onclick=()=>$("file").click();$("merge").onclick=()=>$("file2").click();
$("file").onchange=e=>{openFile(e.target.files[0]);e.target.value=""};$("file2").onchange=e=>{openFile(e.target.files[0],true);e.target.value=""};
let dc=0;addEventListener("dragenter",e=>{e.preventDefault();dc++;$("drop").hidden=false});addEventListener("dragleave",()=>{if(--dc<=0){dc=0;$("drop").hidden=true}});
addEventListener("dragover",e=>e.preventDefault());addEventListener("drop",e=>{e.preventDefault();dc=0;$("drop").hidden=true;openFile(e.dataTransfer.files[0],pages.length&&e.shiftKey)});

function show(){const p=pages[cur];cv.width=p.base.width;cv.height=p.base.height;hv=null;zoom();draw();thumbs();$("pn").value=cur+1;$("pt").textContent="/ "+pages.length;
  $("prev").disabled=cur===0;$("next").disabled=cur===pages.length-1;props()}
function zoom(){cv.style.width=(cv.width/S*zm)+"px";$("zl").textContent=Math.round(zm*100)+"%"}
const setZ=z=>{zm=Math.min(3,Math.max(.3,z));zoom()};
function fit(){zm=Math.min(1.6,Math.max(.3,($("stage").clientWidth-48)/(pages[0].base.width/S)))}
$("fit").onclick=()=>{fit();zoom()};$("zi").onclick=()=>setZ(zm*1.2);$("zo").onclick=()=>setZ(zm/1.2);
$("stage").addEventListener("wheel",e=>{if(e.ctrlKey){e.preventDefault();setZ(zm*(e.deltaY<0?1.1:.9))}},{passive:false});
const go=i=>{commit();if(i>=0&&i<pages.length){cur=i;show()}};
$("prev").onclick=()=>go(cur-1);$("next").onclick=()=>go(cur+1);$("pn").onchange=e=>go((+e.target.value||1)-1);

function drawOp(c,o){
  c.save();c.fillStyle=c.strokeStyle=o.color;c.lineWidth=o.lw||2;c.lineCap="round";c.lineJoin="round";
  if(o.t==="r")c.fillRect(o.x,o.y,o.w,o.h);
  else if(o.t==="h"){c.globalCompositeOperation="multiply";c.fillRect(o.x,o.y,o.w,o.h)}
  else if(o.t==="t"){c.font=o.size+'px "'+o.font+'"';c.textBaseline="alphabetic";c.fillText(o.text,o.x,o.y)}
  else if(o.t==="s"){if(o.k==="e"){c.beginPath();c.ellipse(o.x+o.w/2,o.y+o.h/2,Math.abs(o.w/2),Math.abs(o.h/2),0,0,7);c.stroke()}else c.strokeRect(o.x,o.y,o.w,o.h)}
  else if(o.t==="l"){c.beginPath();c.moveTo(o.x,o.y);c.lineTo(o.x2,o.y2);c.stroke()}
  else if(o.t==="p"){c.beginPath();o.pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke()}
  else if(o.t==="i")c.drawImage(o.img,o.x,o.y,o.w,o.h);
  c.restore();
}
const paint=(c,p)=>{c.drawImage(p.base,0,0);p.ops.forEach(o=>drawOp(c,o))};
function bb(o){
  if(o.t==="t"){ctx.font=o.size+'px "'+o.font+'"';return{x:o.x,y:o.y-o.size,w:ctx.measureText(o.text).width,h:o.size*1.3}}
  if(o.t==="p"){const xs=o.pts.map(q=>q[0]),ys=o.pts.map(q=>q[1]),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}
  if(o.t==="l")return{x:Math.min(o.x,o.x2),y:Math.min(o.y,o.y2)-8,w:Math.abs(o.x2-o.x)||2,h:Math.abs(o.y2-o.y)+16};
  return{x:Math.min(o.x,o.x+o.w),y:Math.min(o.y,o.y+o.h),w:Math.abs(o.w),h:Math.abs(o.h)};
}
function moved(o,dx,dy){const n={...o};if(o.t==="p")n.pts=o.pts.map(q=>[q[0]+dx,q[1]+dy]);else{n.x+=dx;n.y+=dy;if(o.t==="l"){n.x2+=dx;n.y2+=dy}}return n}
const live=()=>sel&&pages[cur].ops.includes(sel);
function draw(){
  const p=pages[cur];paint(ctx,p);
  if(term)for(const b of p.boxes)if(b.str.toLowerCase().includes(term)){ctx.strokeStyle="#ff7a00";ctx.lineWidth=3;ctx.strokeRect(b.x-2,b.y-b.fs,b.w+4,b.fs*1.3)}
  if(hv&&!drag&&!pending){ctx.fillStyle="rgba(79,70,229,.2)";ctx.fillRect(hv.x-2,hv.y-hv.fs*.95,hv.w+4,hv.fs*1.3)}
  if(drag){if(drag.t==="r"||drag.t==="h"){ctx.save();ctx.strokeStyle="#4f46e5";ctx.setLineDash([8,6]);ctx.lineWidth=2;ctx.strokeRect(drag.x,drag.y,drag.w,drag.h);ctx.restore()}else drawOp(ctx,drag)}
  if(live()){const b=bb(sel);ctx.save();ctx.strokeStyle="#4f46e5";ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.strokeRect(b.x-4,b.y-4,b.w+8,b.h+8);ctx.restore()}
}
function thumbs(){
  const side=$("side");side.innerHTML="";
  pages.forEach((p,i)=>{const d=document.createElement("div");d.className="th"+(i===cur?" cur":"");
    const c=document.createElement("canvas"),k=120/p.base.width;c.width=120;c.height=Math.round(p.base.height*k);
    const x=c.getContext("2d");x.scale(k,k);paint(x,p);d.appendChild(c);
    const s=document.createElement("small");s.innerHTML=`<span>${i+1}</span><span class="acts"><button data-a="up" title="Move up">↑</button><button data-a="dn" title="Move down">↓</button><button data-a="rm" title="Delete page">✕</button></span>`;
    d.appendChild(s);d.onclick=e=>{const a=e.target.dataset.a;if(!a){go(i);return}
      if(a==="rm"){if(pages.length<2){toast("A PDF needs at least one page");return}snap();pages.splice(i,1);cur=Math.min(cur,pages.length-1)}
      else if(a==="up"&&i>0){snap();[pages[i-1],pages[i]]=[pages[i],pages[i-1]];cur=i-1}
      else if(a==="dn"&&i<pages.length-1){snap();[pages[i+1],pages[i]]=[pages[i],pages[i+1]];cur=i+1}
      show()};
    side.appendChild(d)});
  const c=side.querySelector(".cur");if(c)c.scrollIntoView({block:"nearest"});
}
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
const loadFont=async(f,t)=>{try{await document.fonts.load('16px "'+f+'"',t||"অআকখ")}catch(e){}};
const hitBox=m=>pages[cur].boxes.find(b=>m.x>=b.x-2&&m.x<=b.x+b.w+2&&m.y>=b.y-b.fs&&m.y<=b.y+b.fs*.35);
const topAt=m=>[...pages[cur].ops].reverse().find(o=>{const b=bb(o);return m.x>=b.x-6&&m.x<=b.x+b.w+6&&m.y>=b.y-6&&m.y<=b.y+b.h+6});
const push=(...ops)=>{snap();pages[cur].ops.push(...ops);sel=ops[ops.length-1];draw();thumbs();props()};

function props(){
  let n=NEED[mode];
  if(mode==="select"&&pages.length&&live()){const o=sel;n=SELN[o.t]+" del";
    if(o.t==="t")$("font").value=o.font;if("tslp".includes(o.t))$("tc").value=o.color;if("slp".includes(o.t))$("lw").value=Math.round(o.lw/S)||1;
    if(o.t==="h")$("hc").value=o.color;if(o.t==="r")$("ec").value=o.color}
  const a=n.split(" ");Q("[data-p]").forEach(g=>g.hidden=!a.includes(g.dataset.p));
  $("hint").textContent=HINT[mode]}
function applySel(){
  if(mode!=="select"||!pages.length||!live())return;const p=pages[cur],i=p.ops.indexOf(sel),n={...sel},sz=parseFloat($("size").value);
  if(n.t==="t"){n.font=$("font").value;n.color=$("tc").value;if(sz)n.size=sz*S}
  else if("slp".includes(n.t)){n.color=$("tc").value;n.lw=+$("lw").value*S}
  else if(n.t==="h")n.color=$("hc").value;else if(n.t==="r")n.color=$("ec").value;else return;
  snap();p.ops[i]=n;sel=n;if(n.t==="t")loadFont(n.font,n.text).then(()=>{draw();thumbs()});draw();thumbs()}
["font","size","tc","lw","ec","hc"].forEach(id=>$(id).onchange=applySel);

function setMode(m){commit();mode=m;sel=null;Q("#rail [data-mode]").forEach(x=>x.classList.toggle("on",x.dataset.mode===m));
  cv.style.cursor=m==="select"?"default":m==="add"?"text":/^(edit|ul|st)$/.test(m)?"pointer":"crosshair";
  cv.style.touchAction=/^(edit|ul|st)$/.test(m)?"pan-x pan-y":"none";props();if(pages.length)draw()}
Q("#rail [data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));setMode("select");

function openEditor(x,y,size,text,eraseRect,replace){
  commit();const k=cv.getBoundingClientRect().width/cv.width;pending={x,y,size,eraseRect,replace};
  ed.hidden=false;ed.value=text;ed.style.left=(x*k-2)+"px";ed.style.top=((y-size)*k)+"px";ed.style.fontSize=(size*k)+"px";
  ed.style.fontFamily='"'+$("font").value+'",sans-serif';ed.style.height=(size*1.3*k)+"px";ed.style.width=Math.max(140,text.length*size*.6+40)*k+"px";
  loadFont($("font").value,text);ed.focus();ed.select();
}
async function commit(){
  if(!pending){ed.hidden=true;return}
  const p=pending,text=ed.value;pending=null;ed.hidden=true;
  const g=[];if(p.eraseRect)g.push(p.eraseRect);
  if(text.trim()){await loadFont($("font").value,text);g.push({t:"t",x:p.x,y:p.y,size:p.size,text,font:$("font").value,color:$("tc").value})}
  if(g.length||p.replace){snap();if(p.replace)pages[cur].ops=pages[cur].ops.filter(o=>o!==p.replace);pages[cur].ops.push(...g);sel=g[g.length-1]||null}
  draw();thumbs();props();
}
ed.addEventListener("keydown",e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){e.stopPropagation();pending=null;ed.hidden=true;draw()}});
ed.addEventListener("blur",()=>setTimeout(commit,0));

cv.addEventListener("pointerdown",e=>{
  if(!pages.length)return;const m=pos(e),size=parseFloat($("size").value),col=$("tc").value,lw=+$("lw").value*S,ops=pages[cur].ops;
  if(mode==="select"){const o=topAt(m);sel=o||null;if(o){snap();mv={sx:m.x,sy:m.y,o};cv.setPointerCapture(e.pointerId)}draw();props();return}
  if(mode==="add"){e.preventDefault();openEditor(m.x,m.y,(size||14)*S,"");return}
  if(mode==="edit"){const b=hitBox(m);if(!b)return;e.preventDefault();
    const r={t:"r",x:b.x-2,y:b.y-b.fs*.95,w:b.w+4,h:b.fs*1.3,color:$("ec").value};
    ops.push(r);hv=null;draw();ops.pop();openEditor(b.x,b.y,size?size*S:b.fs,b.str,r);return}
  if(mode==="ul"||mode==="st"){const b=hitBox(m);if(!b)return;const y=mode==="ul"?b.y+b.fs*.12:b.y-b.fs*.3;
    push({t:"l",x:b.x,y,x2:b.x+b.w,y2:y,color:col,lw:Math.max(2,b.fs/14)});return}
  cv.setPointerCapture(e.pointerId);
  const base={erase:{t:"r",color:$("ec").value},hl:{t:"h",color:$("hc").value},rect:{t:"s",k:"r",color:col,lw},ell:{t:"s",k:"e",color:col,lw},line:{t:"l",color:col,lw},pen:{t:"p",color:col,lw,pts:[[m.x,m.y]]}}[mode];
  drag={...base,x:m.x,y:m.y,w:0,h:0,x2:m.x,y2:m.y,sx:m.x,sy:m.y};
});
cv.addEventListener("pointermove",e=>{
  const m=pos(e);
  if(mv){const i=pages[cur].ops.indexOf(sel);if(i<0)return;const n=moved(mv.o,m.x-mv.sx,m.y-mv.sy);pages[cur].ops[i]=n;sel=n;draw();return}
  if(drag){
    if(drag.t==="p")drag.pts.push([m.x,m.y]);else if(drag.t==="l"){drag.x2=m.x;drag.y2=m.y}
    else if(drag.t==="s"){drag.w=m.x-drag.sx;drag.h=m.y-drag.sy}
    else{drag.x=Math.min(m.x,drag.sx);drag.y=Math.min(m.y,drag.sy);drag.w=Math.abs(m.x-drag.sx);drag.h=Math.abs(m.y-drag.sy)}
    draw();return}
  if(!pages.length||e.pointerType==="touch")return;
  if(mode==="select")cv.style.cursor=topAt(m)?"move":"default";
  else if(/^(edit|ul|st|hl)$/.test(mode)){const b=hitBox(m)||null;if(b!==hv){hv=b;draw()}}
});
cv.addEventListener("pointerleave",()=>{if(hv){hv=null;draw()}});
cv.addEventListener("pointerup",e=>{
  if(mv){mv=null;thumbs();return}
  if(!drag)return;const d=drag;drag=null;
  if(d.t==="h"&&d.w<4&&d.h<4){const b=hitBox(pos(e));if(b){push({t:"h",x:b.x-2,y:b.y-b.fs*.95,w:b.w+4,h:b.fs*1.3,color:d.color});return}}
  const ok=d.t==="p"?d.pts.length>2:d.t==="l"?Math.hypot(d.x2-d.x,d.y2-d.y)>4:Math.abs(d.w)>3&&Math.abs(d.h)>3;
  if(ok){const{sx,sy,...o}=d;push(o)}else draw();
});
cv.addEventListener("dblclick",e=>{
  if(mode!=="select")return;const m=pos(e),o=[...pages[cur].ops].reverse().find(o=>{if(o.t!=="t")return false;const b=bb(o);return m.x>=b.x&&m.x<=b.x+b.w&&m.y>=b.y&&m.y<=b.y+b.h});
  if(o){$("font").value=o.font;$("tc").value=o.color;openEditor(o.x,o.y,o.size,o.text,null,o)}
});

$("img").onclick=()=>$("imgf").click();
$("imgf").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(!pages.length){toast("Open a PDF first");return}
  const im=new Image();im.onload=()=>{const w=cv.width*.3,h=w*im.height/im.width;setMode("select");push({t:"i",img:im,x:(cv.width-w)/2,y:(cv.height-h)/2,w,h,color:"#000"});toast("Drag the image to position it")};im.src=URL.createObjectURL(f)};
function delSel(){if(!live())return;const p=pages[cur];snap();p.ops=p.ops.filter(o=>o!==sel);sel=null;draw();thumbs();props()}
$("del").onclick=delSel;$("undo").onclick=undo;
const KEYS={v:"select",e:"edit",t:"add",x:"erase",h:"hl",u:"ul",s:"st",p:"pen",r:"rect",o:"ell",l:"line"};
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();undo();return}
  if(e.ctrlKey||e.metaKey||e.altKey||!pages.length)return;
  if(k==="delete"||k==="backspace"){e.preventDefault();delSel()}
  else if(k==="escape"){sel?(sel=null,draw(),props()):setMode("select")}
  else if(k==="pageup")go(cur-1);else if(k==="pagedown")go(cur+1);
  else if(k==="i")$("img").click();else if(KEYS[k])setMode(KEYS[k]);
});
$("q").onkeydown=e=>{if(e.key!=="Enter"||!pages.length)return;term=e.target.value.trim().toLowerCase();if(!term){draw();return}
  let f=false;for(let k=0;k<pages.length;k++){const i=(cur+(e.target.dataset.s===term?k+1:k))%pages.length;
    if(pages[i].boxes.some(b=>b.str.toLowerCase().includes(term))){cur=i;f=true;break}}
  e.target.dataset.s=term;if(!f)toast("No matches for “"+term+"”");show()};
$("q").oninput=e=>{if(!e.target.value){term="";pages.length&&draw()}};

$("save").onclick=async()=>{
  await commit();const b=$("save");b.disabled=true;
  try{for(const f of new Set(pages.flatMap(p=>p.ops.filter(o=>o.t==="t").map(o=>o.font))))await loadFont(f);
    const{jsPDF}=window.jspdf;let pdf=null;
    for(let i=0;i<pages.length;i++){const p=pages[i];toast("Rendering page "+(i+1)+" of "+pages.length+"…",0);await new Promise(r=>setTimeout(r));
      const c=document.createElement("canvas");c.width=p.base.width;c.height=p.base.height;paint(c.getContext("2d"),p);
      const w=c.width/S,h=c.height/S,o=w>h?"l":"p";
      if(!pdf)pdf=new jsPDF({unit:"pt",format:[w,h],orientation:o,compress:true});else pdf.addPage([w,h],o);
      pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,w,h)}
    pdf.save(fname);undoS=[];$("undo").disabled=true;toast("Saved as "+fname)}catch(err){toast("Could not save: "+err.message,5000)}
  b.disabled=false;
};
</script>
</body>
</html>
